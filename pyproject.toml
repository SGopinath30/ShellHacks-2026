[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synchro-ingestion"
version = "0.1.0"
description = "Public source preservation and unverified geospatial discovery for SYNCHRO"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
  "pypdf>=6,<7",
  "pyproj>=3.7,<4",
  "pyshp>=2.3,<3",
  "requests>=2.32,<3",
  "shapely>=2.1,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
synchro-ingest = "ingestion.cli:main"

[tool.setuptools.packages.find]
include = ["ingestion*"]

[tool.setuptools.package-data]
"ingestion.catalog" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["ingestion/tests"]
