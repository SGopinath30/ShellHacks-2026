[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gridlock-extraction"
version = "0.1.0"
description = "Evidence-grounded utility project extraction pipeline"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<1",
  "pydantic>=2.7,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
documents = ["pypdf>=5,<7", "python-docx>=1.1,<2"]
dev = ["httpx>=0.27,<1", "pytest>=8,<10"]
modal = ["modal>=1.5,<2"]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["agents*", "evals*", "extraction*"]

[tool.pytest.ini_options]
testpaths = ["evals/tests"]
addopts = "-q"
